map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen @@WEB_PORT@@ default_server;
  server_name _;
  client_max_body_size 6m;

  root @@WEB_ROOT@@;
  index index.html;

  location /api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location /downloads/ {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="taeia.apk"';
  }

  location /uploads/ {
    alias @@UPLOAD_DIR@@/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js|manifest\.json|version\.json)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
}
