<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="เช็คราคาสินค้า ราคาปลีกและราคาส่ง ร้านแต๊ะเอียสกินช็อป">
  <meta name="theme-color" content="#16A34A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="แต๊ะเอีย">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ร้านแต๊ะเอียสกินช็อป</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #f6f7f9; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(34,197,94,.22), transparent 55%),
        linear-gradient(180deg, #ffffff 0%, #f6f7f9 100%);
      font-family: 'Prompt', sans-serif; color: #16a34a; z-index: 20;
    }
    #splash img {
      width: 88px; height: 88px; border-radius: 24px;
      box-shadow: 0 12px 32px rgba(22,163,74,.25);
      animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
    }
    #splash b { font-size: 20px; letter-spacing: .2px; animation: rise .7s .08s cubic-bezier(.2,.8,.2,1) both; }
    #splash i {
      width: 42px; height: 3px; border-radius: 99px; background: #d1fae5; overflow: hidden; display: block;
    }
    #splash i::after {
      content: ""; display: block; height: 100%; width: 40%; border-radius: 99px; background: #16a34a;
      animation: load 1s ease-in-out infinite;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes load { 0% { transform: translateX(-120%); } 100% { transform: translateX(280%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash img, #splash b, #splash i::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <b>ร้านแต๊ะเอียสกินช็อป</b>
    <i></i>
  </div>
  <script>
    (function () {
      var deferredPrompt = null;
      window.pwaStandalone = function () {
        var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        return standalone ? '1' : '0';
      };
      window.pwaPlatform = function () {
        var ua = navigator.userAgent || '';
        var iPad = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        if (/iphone|ipad|ipod/i.test(ua) || iPad) return 'ios';
        if (/android/i.test(ua)) return 'android';
        return 'other';
      };
      window.downloadAndroidApk = function () {
        var a = document.createElement('a');
        a.href = '/downloads/taeia.apk';
        a.download = 'taeia.apk';
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
      window.installAndroidApp = function () {
        if (!deferredPrompt) return Promise.resolve('unavailable');
        var pending = deferredPrompt;
        pending.prompt();
        return pending.userChoice.then(function (choice) {
          deferredPrompt = null;
          return (choice && choice.outcome) || 'dismissed';
        });
      };
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('splash');
        if (!splash) return;
        splash.style.transition = 'opacity .35s ease';
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 360);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
