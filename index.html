<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คราคาสินค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#22c55e; --green-d:#16a34a; --green-l:#dcfce7; --ink:#1f2937; --muted:#9ca3af; --bg:#f6f7f9; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Prompt',sans-serif; background:var(--bg); color:var(--ink); max-width:640px; margin:0 auto; min-height:100vh; }
  header { background:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; box-shadow:0 1px 4px #0001; }
  .logo { display:flex; align-items:center; }
  .logo img { height:56px; width:auto; display:block; background:transparent; object-fit:contain; }
  .logo b { background:linear-gradient(135deg,#34d399,#16a34a); color:#fff; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; }
  .btn { border:none; font-family:inherit; cursor:pointer; border-radius:12px; padding:10px 16px; font-size:15px; font-weight:500; }
  .btn-g { background:var(--green); color:#fff; }
  .btn-l { background:#f1f5f9; color:var(--ink); }
  .btn-r { background:#fee2e2; color:#dc2626; }
  .search { margin:16px; background:#fff; border-radius:16px; padding:14px 16px; display:flex; gap:10px; box-shadow:0 2px 8px #0000000a; }
  .search input { border:none; outline:none; flex:1; font-family:inherit; font-size:16px; }
  .cats { display:flex; gap:10px; overflow-x:auto; padding:0 16px 8px; }
  .cat { white-space:nowrap; padding:10px 22px; border-radius:999px; background:#eef0f3; font-weight:500; cursor:pointer; }
  .cat.on { background:linear-gradient(135deg,#34d399,#16a34a); color:#fff; }
  .sec { display:flex; justify-content:space-between; align-items:center; padding:16px; }
  .sec h2 { font-size:20px; } .sec span { color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 100px; }
  .card { background:#fff; border-radius:16px; overflow:hidden; cursor:pointer; box-shadow:0 2px 8px #0000000d; }
  .card img, .noimg { width:100%; aspect-ratio:1; object-fit:cover; background:#fce7f3; display:grid; place-items:center; color:#db2777; font-size:40px; }
  .card .info { padding:10px 12px; }
  .card h3 { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .retail { color:var(--muted); font-size:13px; }
  .card .ws { color:var(--green-d); font-weight:600; font-size:14px; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px; }
  /* modal */
  .ov { position:fixed; inset:0; background:#0006; backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .ov.show { display:flex; }
  .modal { background:#fff; border-radius:28px; width:100%; max-width:480px; max-height:92vh; overflow:auto; }
  .mh { padding:22px 22px 14px; display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid #eee; }
  .mh h2 { font-size:22px; } .mh p { color:#6b7280; font-size:14px; }
  .x { width:44px; height:44px; flex-shrink:0; border-radius:50%; border:none; background:#f1f3f5; font-size:22px; color:#6b7280; cursor:pointer; }
  .mb { padding:18px 22px 22px; background:#fafafb; }
  .mimg { width:100%; border-radius:18px; max-height:260px; object-fit:contain; background:#fff; margin-bottom:14px; }
  .tier { display:flex; align-items:center; gap:16px; background:#fff; border:2px solid #e5e7eb; border-radius:20px; padding:14px 18px; margin-bottom:12px; cursor:pointer; transition:.15s; }
  .tier .n { width:56px; height:56px; border-radius:50%; background:#f1f3f5; display:grid; place-items:center; font-weight:700; font-size:18px; color:#4b5563; flex-shrink:0; }
  .tier .t { flex:1; } .tier .t b { font-size:17px; display:block; } .tier .t small { color:var(--muted); }
  .tier .p { font-size:22px; font-weight:700; }
  .tier.on { border-color:var(--green); } .tier.on .n { background:var(--green-l); color:var(--green-d); border:1px solid #bbf7d0; }
  .tier.on .t small, .tier.on .p { color:var(--green); }
  .qty { display:flex; align-items:center; justify-content:center; gap:14px; margin:16px 0 10px; }
  .qty button { width:46px; height:46px; border-radius:50%; border:none; background:#e5e7eb; font-size:22px; cursor:pointer; }
  .qty input { width:90px; text-align:center; font-size:22px; font-family:inherit; font-weight:600; border:2px solid #e5e7eb; border-radius:12px; padding:6px; }
  .total { background:#fff; border-radius:18px; padding:14px 18px; }
  .total div { display:flex; justify-content:space-between; padding:3px 0; }
  .total .big { font-size:22px; font-weight:700; color:var(--green-d); }
  .save { color:#dc2626; font-size:14px; text-align:center; margin-top:8px; }
  /* admin form */
  label { display:block; font-weight:500; margin:12px 0 6px; font-size:14px; }
  .inp { width:100%; padding:11px 14px; border:2px solid #e5e7eb; border-radius:12px; font-family:inherit; font-size:15px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .row .inp { flex:1; }
  .prev { width:100%; max-height:200px; object-fit:contain; border-radius:12px; margin-top:8px; display:none; }
  .fab { position:fixed; bottom:24px; right:max(24px, calc(50% - 296px)); width:60px; height:60px; border-radius:50%; font-size:30px; box-shadow:0 6px 16px #16a34a66; }
  .acts { display:flex; gap:8px; margin-top:18px; } .acts .btn { flex:1; }
</style>
</head>
<body>

<header>
  <div class="logo"><img src="logo.png" alt="ร้านแต๊ะเอียสกินช็อป" style="height:56px"></div>
  <button class="btn btn-l" id="modeBtn" onclick="toggleAdmin()">⚙️ จัดการสินค้า</button>
</header>

<div class="search">🔍<input id="q" placeholder="ค้นหาสินค้า..." oninput="render()"></div>
<div class="cats" id="cats"></div>
<div class="sec"><h2 id="secTitle">สินค้าแนะนำ</h2><span id="count"></span></div>
<div class="grid" id="grid"></div>
<button class="btn btn-g fab" id="fab" style="display:none" onclick="openForm()">+</button>

<!-- ดูราคา -->
<div class="ov" id="ovView" onclick="if(event.target===this)closeOv('ovView')">
  <div class="modal">
    <div class="mh"><div><h2 id="vName"></h2><p>กรุณาเลือกรูปแบบราคาที่ต้องการ</p></div><button class="x" onclick="closeOv('ovView')">✕</button></div>
    <div class="mb">
      <img id="vImg" class="mimg">
      <div id="vTiers"></div>
      <div class="qty">
        <button onclick="setQty(qty-1)">−</button>
        <input id="vQty" type="number" min="1" oninput="setQty(+this.value||1, true)">
        <button onclick="setQty(qty+1)">+</button>
      </div>
      <div class="total">
        <div><span>ราคาต่อชิ้น</span><b id="vUnit"></b></div>
        <div><span>รวม</span><span class="big" id="vTotal"></span></div>
      </div>
      <div class="save" id="vSave"></div>
    </div>
  </div>
</div>

<!-- ฟอร์มสินค้า -->
<div class="ov" id="ovForm" onclick="if(event.target===this)closeOv('ovForm')">
  <div class="modal">
    <div class="mh"><div><h2 id="fTitle">เพิ่มสินค้า</h2><p>ราคาต่อชิ้นตามจำนวนที่ซื้อ</p></div><button class="x" onclick="closeOv('ovForm')">✕</button></div>
    <div class="mb">
      <label>รูปภาพ</label>
      <input type="file" accept="image/*" class="inp" onchange="loadImg(this)">
      <img id="fPrev" class="prev">
      <label>ชื่อสินค้า</label><input id="fName" class="inp">
      <label>หมวดหมู่</label><input id="fCat" class="inp" list="catList" placeholder="เช่น สกินแคร์"><datalist id="catList"></datalist>
      <label>ราคาปลีก (1 ชิ้น)</label><input id="fRetail" type="number" class="inp">
      <label>ราคาส่ง (ซื้อตั้งแต่ X ชิ้น → ราคาชิ้นละ)</label>
      <div id="fTiers"></div>
      <button class="btn btn-l" onclick="addTierRow()">+ เพิ่มเรทราคาส่ง</button>
      <div class="acts">
        <button class="btn btn-r" id="fDel" onclick="delProduct()">ลบ</button>
        <button class="btn btn-g" onclick="saveProduct()">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<script>
const KEY = 'price-app-products';
let products = JSON.parse(localStorage.getItem(KEY) || 'null') || [
  { id:1, name:'ครีมซองกานิเย่ชมพู', cat:'สกินแคร์', img:'', retail:29, tiers:[{min:5,price:26},{min:10,price:24}] },
  { id:2, name:'เซรั่มวิตซี 30ml', cat:'สกินแคร์', img:'', retail:420, tiers:[{min:1,price:370},{min:10,price:350}] },
  { id:3, name:'น้ำหอมแจนยัวร์ 30ML', cat:'น้ำหอม', img:'', retail:390, tiers:[{min:5,price:300},{min:10,price:280}] },
];
let admin = false, curCat = 'ทั้งหมด', cur = null, qty = 1, editId = null, formImg = '';

const fmt = n => '฿' + (+n).toLocaleString('th-TH', { maximumFractionDigits:2 });
const persist = () => localStorage.setItem(KEY, JSON.stringify(products));

// รวมราคาปลีกเป็นเรทแรก แล้วเรียงตามจำนวนขั้นต่ำ
function allTiers(p) {
  const t = [{ min:1, price:+p.retail, label:'ราคาปลีก' }, ...p.tiers.map(x => ({ min:+x.min, price:+x.price, label:'ราคาส่ง' }))];
  const byMin = {};
  t.forEach(x => byMin[x.min] = x);
  return Object.values(byMin).sort((a,b) => a.min - b.min);
}
const tierFor = (p, q) => allTiers(p).filter(t => q >= t.min).pop();

function render() {
  const cats = ['ทั้งหมด', ...new Set(products.map(p => p.cat).filter(Boolean))];
  document.getElementById('cats').innerHTML = cats.map(c => `<div class="cat ${c===curCat?'on':''}" onclick="curCat='${c}';render()">${c}</div>`).join('');
  document.getElementById('catList').innerHTML = cats.slice(1).map(c => `<option value="${c}">`).join('');
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = products.filter(p => (curCat==='ทั้งหมด' || p.cat===curCat) && p.name.toLowerCase().includes(q));
  document.getElementById('count').textContent = list.length + ' รายการ';
  document.getElementById('grid').innerHTML = list.length ? list.map(p => {
    const t = allTiers(p), best = t[t.length-1];
    return `<div class="card" onclick="${admin?'openForm':'openView'}(${p.id})">
      ${p.img ? `<img src="${p.img}">` : '<div class="noimg">🛍️</div>'}
      <div class="info"><h3>${p.name}</h3>
        <div class="retail">ปลีก ${fmt(p.retail)}</div>
        <div class="ws">ส่ง ${best.min} ชิ้น+ ${fmt(best.price)}/ชิ้น</div>
      </div></div>`;
  }).join('') : '<div class="empty">ไม่พบสินค้า</div>';
}

function openView(id) {
  cur = products.find(p => p.id === id);
  document.getElementById('vName').textContent = cur.name;
  const img = document.getElementById('vImg');
  img.style.display = cur.img ? 'block' : 'none'; img.src = cur.img;
  setQty(1);
  document.getElementById('ovView').classList.add('show');
}

function setQty(n, typing) {
  qty = Math.max(1, Math.floor(n));
  if (!typing) document.getElementById('vQty').value = qty;
  const active = tierFor(cur, qty);
  document.getElementById('vTiers').innerHTML = allTiers(cur).map(t => `
    <div class="tier ${t===active?'on':''}" onclick="setQty(${t.min})">
      <div class="n">${t.min}</div>
      <div class="t"><b>${t.min===1?'ปลีก 1 ชิ้น':'ส่ง '+t.min+' ชิ้น'}</b><small>${t.min===1?'สำหรับซื้อ 1 ชิ้น':'สำหรับซื้อ '+t.min+' ชิ้นขึ้นไป'}</small></div>
      <div class="p">${fmt(t.price)}</div>
    </div>`).join('');
  document.getElementById('vUnit').textContent = fmt(active.price) + ' / ชิ้น';
  document.getElementById('vTotal').textContent = fmt(active.price * qty);
  const saved = (cur.retail - active.price) * qty;
  const next = allTiers(cur).find(t => t.min > qty);
  document.getElementById('vSave').textContent =
    (saved > 0 ? `ประหยัด ${fmt(saved)} จากราคาปลีก` : '') +
    (next ? `${saved>0?' • ':''}ซื้อเพิ่มอีก ${next.min-qty} ชิ้น ได้ราคา ${fmt(next.price)}/ชิ้น` : '');
}

function toggleAdmin() {
  admin = !admin;
  document.getElementById('modeBtn').textContent = admin ? '🏪 กลับหน้าร้าน' : '⚙️ จัดการสินค้า';
  document.getElementById('fab').style.display = admin ? 'block' : 'none';
  document.getElementById('secTitle').textContent = admin ? 'แตะสินค้าเพื่อแก้ไข' : 'สินค้าแนะนำ';
  render();
}

function addTierRow(min='', price='') {
  const d = document.createElement('div'); d.className = 'row';
  d.innerHTML = `<input class="inp tmin" type="number" placeholder="จำนวน เช่น 10" value="${min}">
    <input class="inp tprice" type="number" placeholder="ชิ้นละ ฿" value="${price}">
    <button class="btn btn-r" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById('fTiers').appendChild(d);
}

function openForm(id) {
  const p = products.find(x => x.id === id) || { name:'', cat:'', retail:'', img:'', tiers:[{min:5,price:''},{min:10,price:''}] };
  editId = id || null; formImg = p.img;
  document.getElementById('fTitle').textContent = editId ? 'แก้ไขสินค้า' : 'เพิ่มสินค้า';
  document.getElementById('fDel').style.display = editId ? 'block' : 'none';
  document.getElementById('fName').value = p.name;
  document.getElementById('fCat').value = p.cat;
  document.getElementById('fRetail').value = p.retail;
  const prev = document.getElementById('fPrev'); prev.src = p.img; prev.style.display = p.img ? 'block' : 'none';
  document.getElementById('fTiers').innerHTML = '';
  p.tiers.forEach(t => addTierRow(t.min, t.price));
  document.getElementById('ovForm').classList.add('show');
}

// ย่อรูปก่อนเก็บ เพื่อไม่ให้ localStorage (~5MB) เต็ม
function loadImg(input) {
  const file = input.files[0]; if (!file) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width*s; c.height = img.height*s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    formImg = c.toDataURL('image/jpeg', 0.8);
    const prev = document.getElementById('fPrev'); prev.src = formImg; prev.style.display = 'block';
  };
  img.src = URL.createObjectURL(file);
}

function saveProduct() {
  const name = document.getElementById('fName').value.trim();
  const retail = +document.getElementById('fRetail').value;
  if (!name || !retail) return alert('กรุณากรอกชื่อและราคาปลีก');
  const tiers = [...document.querySelectorAll('#fTiers .row')]
    .map(r => ({ min:+r.querySelector('.tmin').value, price:+r.querySelector('.tprice').value }))
    .filter(t => t.min >= 1 && t.price > 0);
  const data = { name, retail, tiers, cat:document.getElementById('fCat').value.trim(), img:formImg };
  if (editId) Object.assign(products.find(p => p.id === editId), data);
  else products.unshift({ id:Date.now(), ...data });
  try { persist(); } catch { return alert('พื้นที่เก็บข้อมูลเต็ม ลองใช้รูปที่เล็กลง'); }
  closeOv('ovForm'); render();
}

function delProduct() {
  if (!confirm('ลบสินค้านี้?')) return;
  products = products.filter(p => p.id !== editId);
  persist(); closeOv('ovForm'); render();
}

const closeOv = id => document.getElementById(id).classList.remove('show');
render();
</script>
</body>
</html>
