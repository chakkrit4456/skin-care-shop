# Render Blueprint: Dashboard > New > Blueprint > เลือก repo นี้
# One Node service serves the Flutter web app, the API (/api) and uploads (/uploads).
services:
  - type: web
    name: taeia-skin-shop
    runtime: node
    plan: free            # รูปสินค้าที่อัปโหลดจะหายเมื่อ redeploy บน free; ใช้ starter + disk ด้านล่างเพื่อเก็บถาวร
    region: singapore
    buildCommand: bash render-build.sh
    startCommand: cd server/api && node src/index.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: API_PREFIX
        value: /api
      - key: STATIC_DIR
        value: /opt/render/project/src/price_app/build/web
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      - key: DB_DIR
        value: /opt/render/project/src/server/db
      - key: DATABASE_URL
        fromDatabase:
          name: taeia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false       # Render จะถามตอนสร้าง (อย่างน้อย 8 ตัว)
      - key: ADMIN_SYNC_PASSWORD
        value: "true"
      - key: LINE_OA_ID
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_TARGET_ID
        sync: false
    # เก็บรูปถาวร (ต้องใช้ plan: starter ขึ้นไป) — เอา # ออก และเปลี่ยน UPLOAD_DIR เป็น /var/data/uploads
    # disk:
    #   name: uploads
    #   mountPath: /var/data
    #   sizeGB: 1

databases:
  - name: taeia-db
    plan: free            # free หมดอายุใน 30 วัน; ใช้ basic-256mb สำหรับใช้งานจริง
    region: singapore
    databaseName: taeia
    user: taeia
